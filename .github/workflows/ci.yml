name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricelens
          POSTGRES_PASSWORD: pricelens
          POSTGRES_DB: pricelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pricelens"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://pricelens:pricelens@localhost:5432/pricelens
      RUN_SELENIUM_TESTS: "1"   # the runner image ships Chrome; Selenium Manager fetches the driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are in sync with models
        run: DJANGO_SETTINGS_MODULE=config.settings.test python manage.py makemigrations --check --dry-run
      - run: pytest -ra

  # Builds the production images and boots the whole stack:
  # Nginx -> uWSGI -> Django -> PgBouncer -> PostgreSQL, Redis, Celery, Selenium Grid.
  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build images (uWSGI compiled from source, static files baked into Nginx)
        run: docker compose build

      - name: nginx -t on the shipped config
        run: docker run --rm --add-host web:127.0.0.1 pricelens-nginx:latest nginx -t

      - name: Start stack
        run: |
          docker compose up -d postgres pgbouncer redis migrate web nginx demo-target selenium crawler worker
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/readyz && break
            sleep 3
          done
          curl -fsS http://localhost:8080/readyz
          for i in $(seq 1 60); do
            [ "$(docker compose exec -T selenium curl -fsS http://localhost:4444/status | jq -r .value.ready)" = "true" ] && break
            sleep 2
          done

      - name: Smoke test through Nginx
        run: |
          set -x
          curl -fsS http://localhost:8080/healthz
          # uWSGI health probe speaking the raw uwsgi protocol
          docker compose exec -T web python /app/docker/healthcheck.py
          # Selenium Grid solves the JS challenge, httpx crawls the signed API
          docker compose exec -T web python manage.py crawl demo_shop
          test "$(curl -fsS 'http://localhost:8080/api/v1/products/?source=demo_shop' | jq '.results | length')" = 50
          # micro-cache: second identical anonymous request is served by Nginx
          curl -fsS -o /dev/null http://localhost:8080/api/v1/categories/
          curl -fsS -D - -o /dev/null http://localhost:8080/api/v1/categories/ | grep -i "x-cache-status: HIT"
          # hashed static files with an immutable cache policy
          curl -fsS -D - -o /dev/null "http://localhost:8080/static/$(docker compose exec -T web sh -c 'cd /app/var/static && ls admin/css/base.*.css' | tr -d '\r')" | grep -i immutable

      - name: Celery crawl via the queue (beat-less dispatch)
        run: |
          docker compose exec -T web python manage.py shell -c "
          from apps.crawler.models import Source
          from apps.crawler.tasks import start_crawl
          start_crawl.delay(Source.objects.get(slug='demo_shop').pk, trigger='ci')"
          for i in $(seq 1 60); do
            status=$(curl -fsS 'http://localhost:8080/api/v1/crawler/runs/?source__slug=demo_shop' \
                     | jq -r '[.results[] | select(.trigger == "ci")][0].status // "pending"')
            echo "run status: $status"
            [ "$status" = "succeeded" ] && exit 0
            [ "$status" = "failed" ] && exit 1
            sleep 3
          done
          exit 1

      - name: Report container logs on failure
        if: failure()
        run: |
          for svc in web nginx pgbouncer migrate crawler worker selenium demo-target; do
            logs=$(docker compose logs --no-color --tail=40 "$svc" 2>&1 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=logs: $svc::$logs"
          done
          docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
