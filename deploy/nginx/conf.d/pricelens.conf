# PriceLens virtual host: Nginx in front of uWSGI.
#
#   /static/              served from disk, 1-year immutable cache (hashed filenames)
#   /protected-exports/   internal only; reached via X-Accel-Redirect from Django
#   /api/                 uwsgi_pass + per-IP rate limit + micro-cache for anonymous GETs
#   /                     uwsgi_pass (admin, health checks)

upstream pricelens_uwsgi {
    # "web" resolves to every replica of the web service at startup
    # (docker compose up --scale web=3); requests are round-robined.
    # The uwsgi protocol is one request per connection, so an upstream
    # `keepalive` pool would have no effect here (unlike proxy_pass / HTTP 1.1).
    server web:8000 max_fails=3 fail_timeout=10s;
}

# Anonymous traffic is cacheable; anything carrying credentials bypasses the cache.
map $http_authorization$cookie_sessionid $skip_cache {
    default 1;
    ""      0;
}

server {
    listen 80 default_server;
    server_name _;

    limit_conn conn_per_ip 50;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Request-ID $request_id always;

    # Shared uwsgi settings ------------------------------------------------
    include uwsgi_params;
    uwsgi_param  HTTP_X_REQUEST_ID       $request_id;   # -> Django RequestIDMiddleware
    uwsgi_param  HTTP_X_FORWARDED_PROTO  $scheme;       # -> SECURE_PROXY_SSL_HEADER
    uwsgi_param  HTTP_X_FORWARDED_HOST   $host;
    uwsgi_connect_timeout  5s;
    # > uWSGI harakiri (30s): uWSGI kills the stuck worker and logs a traceback
    # before Nginx gives up with a 504.
    uwsgi_read_timeout     35s;
    uwsgi_send_timeout     35s;
    # Buffer the whole response so a uWSGI worker is freed as soon as Django is
    # done, not when a slow client finishes downloading.
    uwsgi_buffering    on;
    uwsgi_buffer_size  16k;
    uwsgi_buffers      32 16k;
    # Retry another replica on connection failure, but never re-send non-idempotent requests.
    uwsgi_next_upstream  error timeout http_502 http_503;
    uwsgi_next_upstream_tries 2;

    location = /healthz {
        access_log off;
        uwsgi_pass pricelens_uwsgi;
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # security headers again: add_header in a location replaces inherited ones
        add_header X-Content-Type-Options nosniff always;
    }

    # Django answers /api/v1/exports/<id>/download/ with
    #   X-Accel-Redirect: /protected-exports/<file>
    # and Nginx streams the file from here. `internal` = clients can't request it directly.
    location /protected-exports/ {
        internal;
        alias /srv/exports/;
        types { text/csv csv; }
        default_type text/csv;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/v1/products/search/ {
        limit_req zone=search_per_ip burst=10 nodelay;
        include /etc/nginx/conf.d/snippets/api_cache.inc;
        uwsgi_pass pricelens_uwsgi;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        include /etc/nginx/conf.d/snippets/api_cache.inc;
        uwsgi_pass pricelens_uwsgi;
    }

    location / {
        uwsgi_pass pricelens_uwsgi;
    }

    # Internal metrics for a Prometheus nginx exporter.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
