# Top-level Nginx configuration (worker tuning, logging, shared zones).
# The PriceLens virtual host lives in conf.d/pricelens.conf.

user  nginx;
worker_processes  auto;              # one event loop per CPU core
worker_rlimit_nofile  65535;         # >= 2 x worker_connections (client + upstream fd per request)
pid  /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  8192;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # JSON access log with the numbers that matter for tuning: total time,
    # time spent in uWSGI, cache status, and the request id shared with Django.
    log_format  json escape=json '{'
        '"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_addr":"$upstream_addr",'
        '"cache":"$upstream_cache_status","user_agent":"$http_user_agent"}';
    access_log  /var/log/nginx/access.log  json  buffer=64k flush=5s;

    sendfile        on;             # kernel-space file -> socket copies for static/exports
    tcp_nopush      on;             # send headers + first file chunk in one packet
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_max_body_size     2m;
    client_body_buffer_size  64k;
    client_header_timeout    10s;
    client_body_timeout      10s;
    send_timeout             30s;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        application/json text/csv text/plain text/css application/javascript image/svg+xml;

    # Cache file descriptors/metadata of hot static files.
    open_file_cache           max=10000 inactive=60s;
    open_file_cache_valid     120s;
    open_file_cache_min_uses  2;
    open_file_cache_errors    on;

    # --- rate limiting (shared memory zones, keyed by client IP) ---------------
    # 10MB holds ~160k IPs. Different budgets for cheap reads vs. heavy endpoints.
    limit_req_zone   $binary_remote_addr  zone=api_per_ip:10m     rate=30r/s;
    limit_req_zone   $binary_remote_addr  zone=search_per_ip:10m  rate=5r/s;
    limit_conn_zone  $binary_remote_addr  zone=conn_per_ip:10m;
    limit_req_status   429;
    limit_conn_status  429;

    # --- micro-cache for anonymous API GETs ----------------------------------
    # keys in shared memory (10MB ~ 80k keys), bodies on disk (tmpfs in compose).
    uwsgi_cache_path  /var/cache/nginx/api  levels=1:2  keys_zone=api_cache:10m
                      max_size=256m  inactive=10m  use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
