; uWSGI configuration for the PriceLens web tier.
;
; Topology:  client -> Nginx (TLS, buffering, static files, micro-cache)
;                  -> uWSGI master + N workers (this file) -> Django -> PgBouncer -> PostgreSQL
;
; Values marked $(...) come from the environment (defaults set in docker/Dockerfile)
; so the same image is tuned per host via docker-compose.

[uwsgi]
; Refuse to start on unknown/misspelt options instead of silently ignoring them.
strict = true

; ---------------------------------------------------------------------------
; Application
; ---------------------------------------------------------------------------
chdir = /app
module = config.wsgi:application
env = DJANGO_SETTINGS_MODULE=config.settings.prod
; Exit instead of running "dynamic mode" with no app if the import fails.
need-app = true
; All workers share one interpreter; no sub-interpreters (C extensions like
; psycopg are not sub-interpreter safe).
single-interpreter = true

; ---------------------------------------------------------------------------
; Socket: the binary uwsgi protocol, spoken natively by Nginx (uwsgi_pass).
; Cheaper to parse than HTTP and carries Nginx-computed vars (REMOTE_ADDR,
; request id, scheme) as WSGI environ entries. TCP rather than a unix socket
; so `docker compose up --scale web=N` works: Nginx resolves "web" to every replica.
; ---------------------------------------------------------------------------
socket = 0.0.0.0:8000
; Accept-queue depth. Bursts beyond workers*threads wait here instead of being
; refused; must not exceed net.core.somaxconn (raised via compose sysctls).
listen = 1024
; Max size of a request's header block (big cookies / long query strings).
buffer-size = 32768

; ---------------------------------------------------------------------------
; Process model
; ---------------------------------------------------------------------------
master = true
; A worker = process; each runs $(WEB_THREADS) threads. Requests are mostly
; I/O bound (DB, Redis), so a couple of threads per process raises throughput
; without the memory cost of more processes. enable-threads lets app threads
; (psycopg pool, logging handlers) run under the GIL.
processes = $(WEB_PROCESSES)
threads = $(WEB_THREADS)
enable-threads = true
; Serialise accept() between workers to avoid the thundering-herd wakeup.
thunder-lock = true

; Load the app *in each worker after fork* instead of once in the master.
; Costs memory (no copy-on-write sharing of the imported app) but guarantees no
; DB connection, connection pool or thread is accidentally shared across
; forked processes, and is required for touch-chain-reload below.
lazy-apps = true

; Adaptive process spawning ("cheaper" subsystem, busyness algorithm): run at
; least $(WEB_CHEAPER) workers and spawn more up to `processes` when workers
; are busy or requests pile up in the listen queue; reap idle ones later.
cheaper-algo = busyness
cheaper = $(WEB_CHEAPER)
cheaper-initial = $(WEB_CHEAPER)
cheaper-step = 1
cheaper-overload = 5
cheaper-busyness-multiplier = 30
cheaper-busyness-min = 20
cheaper-busyness-max = 70
cheaper-busyness-backlog-alert = 16
cheaper-busyness-backlog-step = 2

; ---------------------------------------------------------------------------
; Worker hygiene: bound the blast radius of leaks and stuck requests
; ---------------------------------------------------------------------------
; Kill (and log a traceback for) any request running longer than this. Keep it
; below Nginx's uwsgi_read_timeout so uWSGI, not Nginx, ends slow requests, and
; above Postgres' statement_timeout so the DB cancels slow queries first.
harakiri = 30
harakiri-verbose = true
; Recycle workers periodically / when they grow, gracefully. With lazy-apps a
; recycle re-imports Django (~1s), so size max-requests to traffic: at ~150
; req/s per worker, 5000 meant a restart every ~35s (seen in load tests).
max-requests = 50000
max-worker-lifetime = 3600
reload-on-rss = 512
worker-reload-mercy = 30

; ---------------------------------------------------------------------------
; Zero-downtime deploys
; ---------------------------------------------------------------------------
; `touch /app/var/reload` restarts workers ONE AT A TIME (chain reload, needs
; lazy-apps), so there is always a worker accepting requests.
touch-chain-reload = /app/var/reload
; Containers stop with SIGTERM; make uWSGI shut down (not reload) on it, letting
; in-flight requests finish (graceful kill of workers).
die-on-term = true
hook-master-start = unix_signal:15 gracefully_kill_them_all

; ---------------------------------------------------------------------------
; Logging & observability
; ---------------------------------------------------------------------------
; Nginx already writes an access log with timings; only log problems here.
disable-logging = true
log-4xx = true
log-5xx = true
log-slow = 1000
memory-report = true
; JSON stats for `uwsgitop 127.0.0.1:9191` / Prometheus uwsgi_exporter:
; per-worker requests, busy/idle state, RSS, average response time.
stats = 127.0.0.1:9191
stats-http = true

; Client disconnects mid-response are normal under load; don't spam the log.
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

auto-procname = true
procname-prefix-spaced = pricelens
vacuum = true
